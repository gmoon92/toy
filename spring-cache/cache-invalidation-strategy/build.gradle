plugins {
    id "java"
    id "org.springframework.boot"
    id "io.spring.dependency-management"
}

bootJar {
    enabled = false
}

group = "com.gmoon.spring-cache.cache-invalidation-strategy"
description = "cache-invalidation-strategy"

subprojects {
    apply plugin: "java"
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        if (project.hasProperty("testcontainers")) {
            systemProperty "cache-invalidation.test.containers", "true"
            applyLocalDockerRuntimeWorkaround(it)
        }
    }
}

/**
 * Testcontainers 는 표준 소켓(/var/run/docker.sock)이 있으면 스스로 런타임을 찾는다.
 * Docker Desktop 대체 런타임(Rancher Desktop 등)은 소켓 경로가 다르고
 * docker-java 가 기본 API 버전 1.32 로 협상해 최신 데몬에서 거부당하므로 이때만 보정한다.
 */
static void applyLocalDockerRuntimeWorkaround(Test task) {
    if (new File("/var/run/docker.sock").exists()) {
        return
    }

    def dockerHost = System.getenv("DOCKER_HOST") ?: resolveLocalDockerHost()
    if (!dockerHost) {
        return
    }

    task.systemProperty "docker.host", dockerHost
    task.systemProperty "api.version", System.getenv("DOCKER_API_VERSION") ?: "1.44"
    task.environment "TESTCONTAINERS_RYUK_DISABLED", "true"
}

static String resolveLocalDockerHost() {
    def home = System.getProperty("user.home")
    def candidates = [
            "${home}/.rd/docker.sock",
            "${home}/.colima/default/docker.sock",
            "${home}/.orbstack/run/docker.sock",
            "${home}/.docker/run/docker.sock",
    ]
    def found = candidates.find { new File(it as String).exists() }
    return found ? "unix://${found}" : null
}
