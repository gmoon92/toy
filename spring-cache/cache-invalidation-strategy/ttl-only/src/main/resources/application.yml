spring:
  application:
    name: ttl-only
  datasource:
    url: jdbc:mysql://localhost:3306/cache_ttl_only?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 111111
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 3s
      timeout: 1s
  cache:
    redis:
      key-prefix: "cache-ttl-only:"
      # time-to-live: 5m   # 스프링 표준 기본 TTL. 지금은 CachePolicy 가 TTL 을 정하므로 쓰지 않는다
      enable-statistics: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true

service:
  cache:
    clear:
      scan-batch-size: 1000
