spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cache_outbox_invalidate?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 111111
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 3s
      timeout: 1s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: simple
  cache:
    redis:
      key-prefix: "cache-outbox-invalidate-test:"
      enable-statistics: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true

service:
  cache:
    clear:
      scan-batch-size: 1000
    outbox:
      queue: cache-outbox-invalidate-test.evict
      # 테스트가 릴레이를 직접 호출해 "앱이 죽어 릴레이가 돌지 않은 상태" 를 만든다
      relay-interval: 1h
      relay-batch-size: 100
